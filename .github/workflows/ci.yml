# Every push and pull request: typecheck, server tests (including against a real
# PostgreSQL), the web build, browser tests, and the container image build.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: einvoicing
          POSTGRES_PASSWORD: einvoicing
          POSTGRES_DB: einvoicing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U einvoicing"
          --health-interval 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://einvoicing:einvoicing@localhost:5432/einvoicing
      E2E_ADMIN_DATABASE_URL: postgres://einvoicing:einvoicing@localhost:5432/einvoicing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Server tests
        run: npm test
      - name: Web build
        run: npm run web:build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Keep browser traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t einvoicing:ci .
      - name: Smoke test the image
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=e -e POSTGRES_PASSWORD=e -e POSTGRES_DB=e postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U e && break; sleep 1; done
          docker run -d --name app --network ci -p 3000:3000 \
            -e DATABASE_URL=postgres://e:e@db:5432/e \
            -e KEY_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e COOKIE_SECURE=false \
            einvoicing:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/health && break; sleep 1; done
          curl -fs http://localhost:3000/health
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          docker logs app | tail -20
